plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

// Phase 14 fix (real-world bug): runServer and runClient shared the same "run/"
// directory by default (Fabric Loom's default when no per-run runDir is set),
// meaning the dedicated test server and client A's own client silently shared
// one config/alltranslator/config.json - the dedicated server's per-player chat
// translation (PerPlayerLanguageResolver) was actually reading/fighting over
// client A's own local config rather than having its own, independent
// server-side config. Giving the "server" run its own directory makes local
// testing correctly mirror a real dedicated server (always a separate machine)
// having a wholly separate config.json from any client.
loom {
    runs {
        server {
            runDir "run-server"
        }
    }
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Phase 7: Mod Menu integration. compileOnly - optional at runtime, only needed to
    // compile against the ModMenuApi interface. Never bundled/shaded (not in shadowBundle).
    compileOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

// Minecraft is not obfuscated on this version, so there is no remapJar task.
// The shaded jar is the mod jar that ships.
jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}
