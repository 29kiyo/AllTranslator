name: Build and Release

# workflow_dispatch のみ。通常の push では一切トリガーしない。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version without the mc suffix (e.g. v1.0.0). The Minecraft version is read from this branch''s gradle.properties and appended automatically (e.g. v1.0.0-mc26.3).'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.compose.outputs.mod_version }}
      full_tag: ${{ steps.compose.outputs.full_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag format (vX.Y.Z)
        run: |
          TAG="${{ inputs.tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: '$TAG'. Expected vX.Y.Z (e.g. v1.0.0) - do not include -mcNN.N, it is added automatically from this branch's gradle.properties."
            exit 1
          fi
          echo "Tag format OK: $TAG"

      - name: Compose full tag from this branch's minecraft_version
        id: compose
        run: |
          TAG="${{ inputs.tag }}"
          MC_VERSION="$(grep -E '^minecraft_version' gradle.properties | sed -E 's/.*=[[:space:]]*//' | tr -d '\r')"
          if [ -z "$MC_VERSION" ]; then
            echo "::error::Could not read minecraft_version from gradle.properties"
            exit 1
          fi
          FULL_TAG="${TAG}-mc${MC_VERSION}"
          echo "mod_version=${TAG#v}-mc${MC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "full_tag=${FULL_TAG}" >> "$GITHUB_OUTPUT"
          echo "This branch builds MC $MC_VERSION -> full tag: $FULL_TAG"

      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FULL_TAG="${{ steps.compose.outputs.full_tag }}"
          if gh api "repos/${{ github.repository }}/releases/tags/${FULL_TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${FULL_TAG} already exists."
            exit 1
          fi
          echo "No existing release for ${FULL_TAG}, proceeding."

  build:
    needs: validate-tag
    runs-on: ubuntu-latest
    env:
      MOD_VERSION: ${{ needs.validate-tag.outputs.mod_version }}
      FULL_TAG: ${{ needs.validate-tag.outputs.full_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # build は check -> test に依存するため、Fabric/NeoForge両方 のビルドとテストを1回で実行する
      - name: Build and test (Fabric + NeoForge)
        run: ./gradlew build -Pmod_version="$MOD_VERSION" --stacktrace

      - name: Verify expected artifact jars exist
        run: |
          FABRIC_JAR="fabric/build/libs/alltranslator-fabric-${MOD_VERSION}.jar"
          NEOFORGE_JAR="neoforge/build/libs/alltranslator-neoforge-${MOD_VERSION}.jar"
          for f in "$FABRIC_JAR" "$NEOFORGE_JAR"; do
            if [ ! -f "$f" ]; then
              echo "::error::Expected artifact not found: $f"
              exit 1
            fi
          done
          echo "FABRIC_JAR=$FABRIC_JAR" >> "$GITHUB_ENV"
          echo "NEOFORGE_JAR=$NEOFORGE_JAR" >> "$GITHUB_ENV"

      - name: Create GitHub Release and upload jars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$FULL_TAG" \
            "$FABRIC_JAR" \
            "$NEOFORGE_JAR" \
            --title "All Translator $FULL_TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes
